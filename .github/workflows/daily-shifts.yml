name: daily-shifts

# 毎日 09:00 JST（00:00 UTC）に、店ページの週間シフト・女優画像・重複整理を行う
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-shifts
  cancel-in-progress: false

jobs:
  shifts:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync shop shifts from Cityheaven
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ: Asia/Tokyo
        run: bun --conditions=react-server scripts/sync-shop-shifts.ts --apply

      - name: Backfill missing actress photos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ: Asia/Tokyo
        run: bun --conditions=react-server scripts/backfill-photos.ts --apply --missing-only --skip-api

      - name: Merge duplicate actresses and shops
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ: Asia/Tokyo
        run: bun --conditions=react-server scripts/clean-merge.ts --apply
