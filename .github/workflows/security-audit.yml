# PFP-106 S13: 依存パッケージ脆弱性の自動監査
# push / PR / 週次 (月曜 6:00 JST) に npm audit を実行し、
# high 以上の既知脆弱性が混入したらビルドを失敗させる。
name: security-audit

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 21 * * 0'  # 毎週月曜 6:00 JST (日曜 21:00 UTC)

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: lockfile 準備 (未生成プロジェクト対応)
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi
      - name: 脆弱性監査 (high 以上で失敗)
        run: npm audit --audit-level=high
