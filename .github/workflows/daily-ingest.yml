name: daily-ingest

# 毎日 03:00 JST（18:00 UTC）に、前日までの取り込み待ち行列を最後まで処理する
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Drain ingest queue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ: Asia/Tokyo
        run: bun --conditions=react-server scripts/ingest-now.ts
